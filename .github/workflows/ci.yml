name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  submission-structure:
    name: Student submission structure
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate student Pull Request scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/validate-student-submission.sh "$BASE_SHA"

  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate scripts syntax
        run: |
          bash -n scripts/validate-student-submission.sh
          bash -n scripts/new-student-bot.sh

      - name: Configure Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify

  student-workflow:
    name: Student workflow smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Scaffold a student bot
        run: |
          bash scripts/new-student-bot.sh             CiSmokeBot             "CI Student"             "CI Smoke"             "Bot généré par le smoke-test du parcours étudiant."

      - name: Build student bot and executable runner
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Locate executable runner
        id: runner
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find chess-tournament/target -maxdepth 1 -name 'chess-tournament-*-runner.jar' -print -quit)"
          test -n "$JAR"
          test -s "$JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Validate generated student bot
        run: |
          java -jar "${{ steps.runner.outputs.jar }}" validate-students             | tee /tmp/validate-students.txt
          grep -q "CI Smoke" /tmp/validate-students.txt

      - name: Verify automatic catalog registration
        run: |
          java -jar "${{ steps.runner.outputs.jar }}" list             | tee /tmp/bot-list.txt
          grep -q "student-ci-smoke" /tmp/bot-list.txt

      - name: Play isolated student duel
        run: |
          java -jar "${{ steps.runner.outputs.jar }}"             console student-ci-smoke random             --isolated             --max-plies=4             --timeout-ms=2000             --heap-mb=128

      - name: Run isolated mini tournament and exports
        run: |
          java -jar "${{ steps.runner.outputs.jar }}"             tournament student-ci-smoke random             --games=2             --isolated             --max-plies=4             --timeout-ms=2000             --heap-mb=128             --pgn=/tmp/student-smoke.pgn             --csv=/tmp/student-smoke.csv

          test -s /tmp/student-smoke.pgn
          test -s /tmp/student-smoke.csv
          grep -q "CI Smoke" /tmp/student-smoke.csv
